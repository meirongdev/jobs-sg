# ServiceMonitor + PrometheusRule. MUST carry release: kube-prometheus-stack
# (docs/04 §2.5) or the operator silently ignores them.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jobs-sg
  namespace: jobs-sg
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: jobs-sg-web}
  endpoints:
    # The `metrics` Service port, not `http`: /metrics is bound to its own
    # listener so the public HTTPRoute cannot reach it (deploy/web.yaml).
    - port: metrics
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobs-sg
  namespace: jobs-sg
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: jobs-sg
      rules:
        # Both ingest kinds count as a fresh crawl. The Sunday run records itself
        # as full_reconcile, not incremental, so the incremental series is
        # legitimately 48h stale every Monday — matching on it alone fired this
        # alert for ~12h every single week, which trains you to ignore the one
        # alert docs/04 §3.2 calls the most important.
        - alert: JobsSgIngestStale
          expr: 'min without(kind) (time() - jobs_sg_last_success_timestamp_seconds{kind=~"incremental|full_reconcile"}) > 36 * 3600'
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: jobs-sg ingest stale >36h (no incremental or reconcile succeeded) — silent failure risk
        - alert: JobsSgReconcileStale
          expr: 'time() - jobs_sg_last_success_timestamp_seconds{kind="full_reconcile"} > 10 * 24 * 3600'
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: jobs-sg full reconcile stale >10d — active-job metric may be wrong
        - alert: JobsSgIngestErrors
          expr: 'increase(jobs_sg_ingest_errors_total[1d]) > 20'
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: jobs-sg ingest errors rising — possible API schema change
        # Watches the backlog's FLOOR rising, not its level.
        #
        # A level threshold cannot work here: the first run's baseline scan
        # stores every currently-live posting at once (~11k candidates), and the
        # LLM drains ~900 a night against ~300 arriving — so an absolute alert
        # fires on night one and keeps firing for the month or two it takes to
        # burn down. That is the same cry-wolf failure JobsSgIngestStale had.
        #
        # The floor is what carries the signal. In steady state the backlog
        # sawtooths — ingest adds at 02:15, enrich drains at 03:10 — so the
        # post-enrich trough returns to roughly the same place each day.
        # Comparing today's trough against yesterday's asks the question that
        # actually matters: is the pipeline still keeping up? A stalled DGX, an
        # endpoint that moved or an enrich job that stopped running all push the
        # floor up by a day's intake; a large backlog that is steadily draining
        # pushes it down and stays quiet.
        - alert: JobsSgEnrichBacklogGrowing
          expr: 'min_over_time(jobs_sg_enrich_backlog[1d]) - min_over_time(jobs_sg_enrich_backlog[1d] offset 1d) > 500'
          for: 2h
          labels: {severity: warning}
          annotations:
            summary: jobs-sg enrich backlog floor rising >500/day — LLM may be down or too slow to keep up
        - alert: JobsSgCronJobFailed
          expr: 'kube_job_status_failed{namespace="jobs-sg"} > 0'
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: jobs-sg cronjob failed
