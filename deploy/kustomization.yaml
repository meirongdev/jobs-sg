apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobs-sg
resources:
  - namespace.yaml
  - pvc.yaml
  - limits.yaml
  - rbac.yaml
  - cronjob-ingest.yaml
  - cronjob-enrich.yaml
  - cronjob-report.yaml
  - web.yaml
  - monitoring.yaml
# Pin the image digest here after the first CI build:
#   docker buildx imagetools inspect ghcr.io/meirongdev/jobs-sg:sha-<sha>
# then: kustomize edit set image ghcr.io/meirongdev/jobs-sg@sha256:...
images:
  - name: ghcr.io/meirongdev/jobs-sg
    newTag: sha-CHANGEME
