# Read-only web pod + Service + HTTPRoute via homelab Cilium Gateway.
# docs/04 §2.1: parentRefs.port MUST be 80 (not 8000); ReferenceGrant v1beta1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-sg-web
  namespace: jobs-sg
  labels: {app: jobs-sg-web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jobs-sg-web}
  template:
    metadata:
      labels: {app: jobs-sg-web}
    spec:
      serviceAccountName: jobs-sg
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/meirongdev/jobs-sg
          command: ["/usr/local/bin/jobs-sg-web"]
          # /metrics listens on 9090, which the HTTPRoute below never targets:
          # the route matches PathPrefix / on port 80 -> 8080, so operational
          # metrics stay in-cluster while the statistics stay public.
          args: ["--data-dir", "/data", "--addr", ":8080", "--metrics-addr", ":9090"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jobs-sg-data
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-sg-web
  namespace: jobs-sg
  labels: {app: jobs-sg-web}
spec:
  selector: {app: jobs-sg-web}
  ports:
    - name: http
      port: 80
      targetPort: 8080
    # Scraped by the ServiceMonitor in monitoring.yaml. Not referenced by any
    # HTTPRoute, so it is reachable only from inside the cluster.
    - name: metrics
      port: 9090
      targetPort: 9090
---
# ReferenceGrant for the namespace gateway (must be v1beta1, docs/04 §2.2)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: jobs-sg-web
  namespace: jobs-sg
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
      name: jobs-sg-web
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jobs-sg-web
  namespace: jobs-sg
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      group: gateway.networking.k8s.io
      kind: Gateway
      port: 80
  hostnames:
    - jobs.meirong.dev
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs:
        - name: jobs-sg-web
          port: 80
