# Dummy jobs-sg-secrets for local testing. In homelab this secret is created by
# an ExternalSecret backed by Vault (deploy docs/04 §5); locally we provide the
# keys the cronjobs reference so the manifests apply. Values are non-functional
# placeholders — do not use them against real services.
apiVersion: v1
kind: Secret
metadata:
  name: jobs-sg-secrets
  namespace: jobs-sg
type: Opaque
stringData:
  bifrost-vk: "local-placeholder-bifrost-vk"
  telegram-bot-token: "local-placeholder-token"
  telegram-chat-id: "local-placeholder-chat-id"
  telegram-thread-id: "local-placeholder-thread-id"
