# Local kind variant of deploy/web.yaml: Deployment + ClusterIP Service only.
# The HTTPRoute/ReferenceGrant (Cilium gateway) and monitoring resources are
# homelab-only and intentionally omitted here. Reach the app via port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-sg-web
  namespace: jobs-sg
  labels: {app: jobs-sg-web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jobs-sg-web}
  template:
    metadata:
      labels: {app: jobs-sg-web}
    spec:
      serviceAccountName: jobs-sg
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/meirongdev/jobs-sg
          command: ["/usr/local/bin/jobs-sg-web"]
          args: ["--data-dir", "/data", "--addr", ":8080", "--metrics-addr", ":9090"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jobs-sg-data
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-sg-web
  namespace: jobs-sg
  labels: {app: jobs-sg-web}
spec:
  selector: {app: jobs-sg-web}
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
