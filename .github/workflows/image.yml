name: image
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/meirongdev/jobs-sg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.semver }}
          # NOTE: manifests must pin the image by digest (Kyverno
          # disallow-latest-tag is Enforce on homelab, docs/04 §2.3).
          # After first push: docker buildx imagetools inspect ghcr.io/meirongdev/jobs-sg:sha-<sha>
      - name: Set GHCR package public
        run: |
          # one-time: repo Settings -> Packages -> jobs-sg -> visibility: Public
          echo "Set package visibility to Public (no imagePullSecret needed)."
